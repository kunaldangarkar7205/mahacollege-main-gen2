<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - MahaCollege</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:30px}
.auth-box{width:400px;max-width:100%;background:#fff;padding:35px;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,.1)}
.auth-box h1{text-align:center;margin-bottom:10px}.auth-box>p{text-align:center;color:#666;margin-bottom:25px}
.auth-box label{display:block;margin-bottom:7px;font-weight:bold}.auth-box input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;margin-bottom:18px}
.auth-button{width:100%;padding:13px;border:0;border-radius:7px;background:#172554;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.auth-button:disabled{opacity:.6;cursor:not-allowed}
.auth-message{text-align:center;margin-top:15px;min-height:22px}.auth-message.error{color:#b91c1c}.auth-message.success{color:#15803d}.auth-link{text-align:center;margin-top:18px}
</style>
</head>
<body>
<nav><div class="logo">🎓 MahaCollege</div><div class="menu"><a href="login.html">Login</a></div></nav>
<div class="auth-page"><div class="auth-box">
<h1>Set New Password 🔐</h1>
<p>Enter your new MahaCollege password.</p>
<form onsubmit="updatePassword(event)">
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" placeholder="Minimum 6 characters" minlength="6" required>
<label for="confirmNewPassword">Confirm New Password</label>
<input id="confirmNewPassword" type="password" placeholder="Re-enter your new password" minlength="6" required>
<button id="updatePasswordButton" class="auth-button" type="submit">Set New Password</button>
</form>
<div id="message" class="auth-message"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
window.addEventListener('load', async () => {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) {
        showMessage('This password reset link is invalid or has expired. Please request a new reset link.');
    }
});
</script>
</body>
</html>
