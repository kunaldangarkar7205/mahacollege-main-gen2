<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MahaCollege</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:30px}
        .auth-box{width:400px;max-width:100%;background:#fff;padding:35px;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,.1)}
        .auth-box h1{text-align:center;margin-bottom:10px}.auth-box>p{text-align:center;color:#666;margin-bottom:25px}
        .auth-box label{display:block;margin-bottom:7px;font-weight:bold}.auth-box input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;margin-bottom:18px}
        .auth-button{width:100%;padding:13px;border:0;border-radius:7px;background:#172554;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.auth-button:disabled{opacity:.6;cursor:not-allowed}
        .auth-message{text-align:center;margin-top:15px;min-height:22px}.auth-message.error{color:#b91c1c}.auth-message.success{color:#15803d}.auth-link{text-align:center;margin-top:18px}
    </style>
</head>
<body>
<nav><div class="logo">🎓 MahaCollege</div><div class="menu"><a href="index.html">Home</a><a href="find-colleges.html">Colleges</a><a href="category-cutoffs.html">Cutoffs</a><a href="college-predictor.html">Predictor</a><a href="compare-colleges.html">Compare</a><a href="notifications.html">Notifications</a></div></nav>
<div class="auth-page"><div class="auth-box">
    <h1>Welcome Back 👋</h1>
    <p>Login to MahaCollege</p>
    <form onsubmit="loginUser(event)">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <button id="loginButton" class="auth-button" type="submit">Login</button>
    </form>
    <div id="message" class="auth-message"></div>
    <div class="auth-link"><a href="forgot-password.html">Forgot Password?</a></div>
    <div class="auth-link">New student? <a href="signup.html">Create an account</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
    const loginParams = new URLSearchParams(window.location.search);
    if (loginParams.get('password_reset') === '1') {
        const message = document.getElementById('message');
        if (message) {
            message.textContent = 'Password changed successfully. Please log in with your new password.';
            message.className = 'auth-message success';
        }
    } else if (loginParams.get('registered') === '1') {
        const message = document.getElementById('message');
        if (message) {
            message.textContent = 'Account created successfully. Please log in to continue.';
            message.className = 'auth-message success';
        }
    }
</script>
</body>
</html>
